name: Deploy Web & Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sync web assets into Android
        run: node scripts/sync-android.mjs
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Copy APK as Notas.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Notas.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notas-APK
          path: Notas.apk
      - name: Publish latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e "console.log(require('./web/version.json').webVersion)")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Notas.apk --clobber
          else
            gh release create "$TAG" Notas.apk --title "Notas ${TAG}" --notes "Compilación automática desde main (${TAG})."
          fi
